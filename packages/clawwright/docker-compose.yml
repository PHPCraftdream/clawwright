# OpenClaw — gateway + CLI.
# Adapted from the upstream openclaw/openclaw compose file, with three changes:
#   1. no `build:` section — we always run a published image, never a local source build;
#   2. data lives in explicit host bind mounts under ${OC_DATA_DIR};
#   3. the gateway port is published on the loopback address only (see OC_BIND_ADDRESS).
#
# Provider API keys do NOT belong here. Put them in ${OC_DATA_DIR}/config/.env,
# which OpenClaw reads as its trusted global env file ($OPENCLAW_STATE_DIR/.env).

x-openclaw-env: &openclaw-env
  HOME: /home/node
  OPENCLAW_HOME: /home/node
  TERM: xterm-256color
  OPENCLAW_STATE_DIR: /home/node/.openclaw
  OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
  OPENCLAW_CONFIG_DIR: /home/node/.openclaw
  OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
  OPENCLAW_GATEWAY_PORT: "18789"
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?run bootstrap to generate .env}
  # Bonjour/mDNS discovery is useless inside a container network.
  OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-1}
  TZ: ${OPENCLAW_TZ:-UTC}

x-openclaw-volumes: &openclaw-volumes
  - "${OC_DATA_DIR:?set OC_DATA_DIR in .env}/config:/home/node/.openclaw"
  - "${OC_DATA_DIR:?set OC_DATA_DIR in .env}/workspace:/home/node/.openclaw/workspace"
  - "${OC_DATA_DIR:?set OC_DATA_DIR in .env}/auth-secrets:/home/node/.config/openclaw"

services:
  gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:extended-stable}
    environment: *openclaw-env
    volumes: *openclaw-volumes
    # Published on loopback by default: the gateway is not meant to face the internet.
    # Reach a remote instance over an SSH tunnel (see README).
    ports:
      - "${OC_BIND_ADDRESS:-127.0.0.1}:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    # Listens on all interfaces *inside* the container so the port publish works;
    # exposure is controlled by OC_BIND_ADDRESS above, not by this flag.
    command:
      ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    healthcheck:
      # The upstream compose file calls dist/docker-healthcheck.js, which does not exist in
      # this image (2026.6.34) — it left the container permanently unhealthy while the
      # gateway was in fact serving. /healthz is the documented liveness probe.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Shared network reaches the gateway; shared PIDs keep state-owner liveness checks valid.
  # One-shot CLI container: started by the `cli` and `mcp-serve` commands whenever
  # cli-helper below is not running.
  cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:extended-stable}
    profiles: ["cli"]
    network_mode: "service:gateway"
    pid: "service:gateway"
    environment:
      <<: *openclaw-env
      BROWSER: echo
    volumes: *openclaw-volumes
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - gateway

  # Persistent twin of `cli`: same image, mounts and network, but its entrypoint just idles
  # instead of running OpenClaw's CLI, so the container stays up. the `cli`/`mcp-serve` commands
  # then `docker exec` into it instead of paying `compose run --rm`'s create/destroy cost on
  # every call — measured directly against this deployment: ~5-7s one-off vs ~1-3s exec.
  # Started/stopped explicitly with `cli-start`/`cli-stop`; `up` never starts
  # it, `down` removes it along with anything else under the "cli" profile.
  cli-helper:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:extended-stable}
    profiles: ["cli"]
    network_mode: "service:gateway"
    pid: "service:gateway"
    environment:
      <<: *openclaw-env
      BROWSER: echo
    volumes: *openclaw-volumes
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      - gateway
