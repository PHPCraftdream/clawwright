name: Native supervisor source checks
run-name: Native supervisor source checks

# Pushes include disposable root-capability component suites.
# Full keeper composition remains a separate manual lab, not product adoption.
on:
  push:
    paths:
      - 'tools/native/go.mod'
      - 'tools/native/task240-native-provider/**'
      - 'tools/native/task245-native-content/**'
      - 'tools/native/task245-native-supervisor/**'
      - 'tools/native/task245-control-profile/**'
      - 'tools/native/task245-lab-broker/**'
      - 'tools/native/task245-acceptance/**'
      - 'tools/native/task245-composed-lab/**'
      - 'tools/native/task240-native-policy/**'
      - 'tools/native/task240-native-admission/**'
      - 'tools/native/task240-launch-stub/**'
      - 'tools/native/task245-domain-init/**'
      - '.github/workflows/native-supervisor.yml'
  pull_request:
    paths:
      - 'tools/native/go.mod'
      - 'tools/native/task240-native-provider/**'
      - 'tools/native/task245-native-content/**'
      - 'tools/native/task245-native-supervisor/**'
      - 'tools/native/task245-control-profile/**'
      - 'tools/native/task245-lab-broker/**'
      - 'tools/native/task245-acceptance/**'
      - 'tools/native/task245-composed-lab/**'
      - 'tools/native/task240-native-policy/**'
      - 'tools/native/task240-native-admission/**'
      - 'tools/native/task240-launch-stub/**'
      - 'tools/native/task245-domain-init/**'
      - '.github/workflows/native-supervisor.yml'
  workflow_dispatch:
    inputs:
      connected_lab:
        description: 'Run the root-capability mechanism profile in a disposable lab (manual approval required)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up existing native toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache: false
      - name: Record required Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          uname -r
          command -v rustc
          rustc --version --verbose
          cargo --version
          rustup show active-toolchain || echo 'rustup is absent; Rust toolchain must be provided by the runner'
          rustc --print target-list | grep -Fx x86_64-unknown-linux-gnu
      - name: Test and compile native Rust components
        shell: bash
        run: |
          set -euo pipefail
          rustc --test --edition=2021 --target=x86_64-unknown-linux-gnu -C opt-level=2 -C target-feature=+crt-static tools/native/task240-launch-stub/main.rs -o "$RUNNER_TEMP/native-launch-stub-tests"
          "$RUNNER_TEMP/native-launch-stub-tests"
          rustc --test --edition=2021 --target=x86_64-unknown-linux-gnu -C opt-level=2 -C target-feature=+crt-static tools/native/task245-domain-init/main.rs -o "$RUNNER_TEMP/native-domain-init-tests"
          "$RUNNER_TEMP/native-domain-init-tests"
          rustc --edition=2021 --target=x86_64-unknown-linux-gnu -C opt-level=2 -C panic=abort -C target-feature=+crt-static -o "$RUNNER_TEMP/native-launch-stub" tools/native/task240-launch-stub/main.rs
          rustc --edition=2021 --target=x86_64-unknown-linux-gnu -C opt-level=2 -C panic=abort -C target-feature=+crt-static -o "$RUNNER_TEMP/native-domain-init" tools/native/task245-domain-init/main.rs
      - name: Test and compile control installer
        shell: bash
        run: |
          set -euo pipefail
          rustc --test --edition=2021 --target=x86_64-unknown-linux-gnu -C opt-level=2 -C target-feature=+crt-static tools/native/task245-control-profile/installer/main.rs -o "$RUNNER_TEMP/control-installer-tests"
          "$RUNNER_TEMP/control-installer-tests"
          rustc --edition=2021 --target=x86_64-unknown-linux-gnu -C opt-level=2 -C panic=abort -C target-feature=+crt-static -o "$RUNNER_TEMP/control-installer" tools/native/task245-control-profile/installer/main.rs
      - name: Build current Go fixture and probe packages
        shell: bash
        working-directory: tools/native
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/native-control-probe" ./task245-control-profile/cmd/control-probe
          go build -o "$RUNNER_TEMP/native-release-fixture" ./task245-acceptance/fixtures/release
          go build -o "$RUNNER_TEMP/native-gateway" ./task245-acceptance/fixtures/gateway
      - name: Run domain init kernel tests
        shell: bash
        working-directory: tools/native
        run: |
          set -euo pipefail
          sudo env -i PATH="$PATH" HOME="$RUNNER_TEMP/native-check-home" GOTOOLCHAIN=local CGO_ENABLED=0 TASK245_INIT="$RUNNER_TEMP/native-domain-init" TASK240_STUB="$RUNNER_TEMP/native-launch-stub" go test -v -count=2 -timeout=90s -run '^TestDomainInit' ./task245-native-supervisor
          sudo env -i PATH="$PATH" HOME="$RUNNER_TEMP/native-check-home" GOTOOLCHAIN=local CGO_ENABLED=0 TASK240_STUB="$RUNNER_TEMP/native-launch-stub" go test -v -count=2 -timeout=30s -run '^TestTraceConstructor' ./task240-native-admission
          sudo env -i PATH="$PATH" HOME="$RUNNER_TEMP/native-check-home" GOTOOLCHAIN=local CGO_ENABLED=0 go test -v -count=1 -timeout=30s ./task245-acceptance/internal/diagnostics
      - name: Run pure Go source tests
        shell: bash
        working-directory: tools/native
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test -run='Test(EncodeLaunchPacket|ParseKeeperConfig|ParseServiceProof245|KeeperInheritedPipes)' ./task245-native-supervisor
          go test -run='^(TestStartupDiagnostics|TestStartGatewayDiagnosticsFailures|TestStartupControlProtocol|TestStartupRootObservation)$' ./task245-native-supervisor
          go test ./task245-native-content ./task240-native-policy ./task240-native-provider ./task245-lab-broker
          go test ./task245-control-profile/cmd/control-profile ./task245-control-profile/cmd/control-probe ./task245-control-profile/cmd/native-metadata ./task245-control-profile/cmd/metadata-regression ./task245-control-profile/internal/proof ./task245-control-profile/internal/regression
          go test ./task245-acceptance/fixtures/gateway ./task245-acceptance/fixtures/release ./task245-acceptance/internal/runner ./task245-acceptance/internal/service ./task245-acceptance/internal/diagnostics ./task245-acceptance/cmd/acceptance ./task245-acceptance/cmd/profile
      - name: Build native Go binaries
        shell: bash
        working-directory: tools/native
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/native-supervisor" ./task245-native-supervisor
          go build -o "$RUNNER_TEMP/native-provider" ./task240-native-provider
          go build -o "$RUNNER_TEMP/native-lab-broker" ./task245-lab-broker
          go build -o "$RUNNER_TEMP/control-profile" ./task245-control-profile/cmd/control-profile
          go build -o "$RUNNER_TEMP/native-metadata" ./task245-control-profile/cmd/native-metadata
          go build -o "$RUNNER_TEMP/metadata-regression" ./task245-control-profile/cmd/metadata-regression
          go build -o "$RUNNER_TEMP/control-probe" ./task245-control-profile/cmd/control-probe
          go build -o "$RUNNER_TEMP/native-gateway" ./task245-acceptance/fixtures/gateway
          go build -o "$RUNNER_TEMP/native-release-fixture" ./task245-acceptance/fixtures/release
          go test -c -o "$RUNNER_TEMP/service-startup-test" ./task245-acceptance/internal/service
          go test -c -o "$RUNNER_TEMP/native-supervisor-test" ./task245-native-supervisor
          go test -c -o "$RUNNER_TEMP/runner-startup-test" ./task245-acceptance/internal/runner
      - name: Run public control metadata kernel suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/control-metadata-input"
          cp "$RUNNER_TEMP/control-profile" "$RUNNER_TEMP/control-metadata-input/control-profile"
          cp "$RUNNER_TEMP/control-installer" "$RUNNER_TEMP/control-metadata-input/control-installer"
          cp "$RUNNER_TEMP/native-metadata" "$RUNNER_TEMP/control-metadata-input/native-metadata"
          cp "$RUNNER_TEMP/metadata-regression" "$RUNNER_TEMP/control-metadata-input/metadata-regression"
          cp "$RUNNER_TEMP/control-probe" "$RUNNER_TEMP/control-metadata-input/probe"
          cp "$RUNNER_TEMP/service-startup-test" "$RUNNER_TEMP/control-metadata-input/service-startup-test"
          cp "$RUNNER_TEMP/native-supervisor-test" "$RUNNER_TEMP/control-metadata-input/native-supervisor-test"
          cp "$RUNNER_TEMP/runner-startup-test" "$RUNNER_TEMP/control-metadata-input/runner-startup-test"
          chmod 0555 "$RUNNER_TEMP/control-metadata-input/control-profile" "$RUNNER_TEMP/control-metadata-input/control-installer" "$RUNNER_TEMP/control-metadata-input/native-metadata" "$RUNNER_TEMP/control-metadata-input/metadata-regression" "$RUNNER_TEMP/control-metadata-input/probe" "$RUNNER_TEMP/control-metadata-input/service-startup-test" "$RUNNER_TEMP/control-metadata-input/native-supervisor-test" "$RUNNER_TEMP/control-metadata-input/runner-startup-test"
          docker run --rm --network none --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL --cap-add SYS_PTRACE --security-opt no-new-privileges --pids-limit 256 --memory 1g --env GITHUB_ACTIONS=true --mount "type=bind,src=$RUNNER_TEMP/control-metadata-input,dst=/input,readonly" --entrypoint /input/metadata-regression python:3.13-slim --initial-identity-suite
          docker run --rm --network none --cap-drop ALL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges --pids-limit 256 --memory 1g --env GITHUB_ACTIONS=true --mount "type=bind,src=$RUNNER_TEMP/control-metadata-input,dst=/input,readonly" --entrypoint /input/metadata-regression python:3.13-slim --owned-cleanup-refusal
          docker run --rm --network none --cap-drop ALL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges --pids-limit 256 --memory 1g --env GITHUB_ACTIONS=true --env TASK245_STARTUP_REFUSAL=1 --mount "type=bind,src=$RUNNER_TEMP/control-metadata-input,dst=/input,readonly" --entrypoint /input/service-startup-test python:3.13-slim -test.run=^TestStartupCleanupKillRefusal$ -test.timeout=10s -test.v
          docker run --rm --network none --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --security-opt no-new-privileges --pids-limit 256 --memory 1g --env TASK245_STARTUP_PIPELINE=1 --env TASK245_STARTUP_CONSUMER=/input/native-supervisor-test --mount "type=bind,src=$RUNNER_TEMP/control-metadata-input,dst=/input,readonly" --entrypoint /input/runner-startup-test python:3.13-slim -test.run=^TestStartupFailureSuppressedConsumerPipeline$ -test.timeout=20s -test.v
          docker run --rm --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --cap-add SYS_PTRACE --cap-add SYS_ADMIN --cap-add KILL --security-opt no-new-privileges --security-opt apparmor=unconfined --pids-limit 256 --memory 1g --env GITHUB_ACTIONS=true --mount "type=bind,src=$RUNNER_TEMP/control-metadata-input,dst=/input,readonly" --entrypoint /input/metadata-regression python:3.13-slim --kernel-suite
          docker run --rm --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --cap-add SYS_PTRACE --cap-add SYS_ADMIN --security-opt no-new-privileges --security-opt apparmor=unconfined --pids-limit 256 --memory 1g --env GITHUB_ACTIONS=true --mount "type=bind,src=$RUNNER_TEMP/control-metadata-input,dst=/input,readonly" --entrypoint /input/metadata-regression python:3.13-slim --confinement-suite

  connected-lab:
    name: Disposable lab CLI-to-native mechanism (not OpenClaw adoption)
    needs: source-checks
    if: github.event_name == 'workflow_dispatch' && inputs.connected_lab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lab_case:
          - confinement
          - connected
          - wrong-holder
          - unexpected-exec
          - partial-ack
          - lost-ack
          - cancel
    # This job deliberately runs the root-only driver in its disposable lab.
    # It is manual-only, has no secrets, and reports mechanism acceptance only.
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out pinned public product source (read-only input)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: PHPCraftdream/ssjack
          ref: ca7ce8023f3fb1a3498d801eda29aa3614961a79
          path: .task245-product-source
          persist-credentials: false
          fetch-depth: 1
      - name: Set up existing native toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache: false
      - name: Run disposable lab acceptance
        shell: bash
        working-directory: tools/native
        env:
          TASK245_LAB_CASE: ${{ matrix.lab_case }}
          TASK245_PRODUCT_CHECKOUT: ${{ github.workspace }}/.task245-product-source
          TASK245_PRODUCT_COMMIT: ca7ce8023f3fb1a3498d801eda29aa3614961a79
          TASK245_PRODUCT_BASE: 2997e692cdc24f5b9a5aa23cadc3b22ab1b32f02
          TASK245_PRODUCT_TAG: ''
          TASK245_IMAGE: python:3.13-slim
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go run ./task245-acceptance/cmd/acceptance
