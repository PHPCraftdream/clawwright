name: Native supervisor source checks
run-name: Native supervisor source checks

# Pushes compile and test source only. The root-capability mechanism profile is a
# separate, manually approved disposable-lab job; it is not product adoption.
on:
  push:
    paths:
      - 'tools/native/go.mod'
      - 'tools/native/task240-native-provider/**'
      - 'tools/native/task245-native-content/**'
      - 'tools/native/task245-native-supervisor/**'
      - 'tools/native/task245-control-profile/**'
      - 'tools/native/task245-lab-broker/**'
      - 'tools/native/task245-acceptance/**'
      - 'tools/native/task245-composed-lab/**'
      - 'tools/native/task240-native-policy/**'
      - 'tools/native/task240-native-admission/**'
      - 'tools/native/task240-launch-stub/stub.c'
      - 'tools/native/task245-domain-init/init.c'
      - '.github/workflows/native-supervisor.yml'
  workflow_dispatch:
    inputs:
      connected_lab:
        description: 'Run the root-capability mechanism profile in a disposable lab (manual approval required)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up existing native toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache: false
      - name: Compile native C source
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -static -Werror=implicit-function-declaration -o "$RUNNER_TEMP/native-launch-stub" tools/native/task240-launch-stub/stub.c
          cc -std=c11 -O2 -static -Werror=implicit-function-declaration -o "$RUNNER_TEMP/native-domain-init" tools/native/task245-domain-init/init.c
          cc -std=c11 -O2 -static -Werror=implicit-function-declaration -o "$RUNNER_TEMP/native-control-profile" tools/native/task245-control-profile/control-profile.c tools/native/task245-control-profile/metadata_client.c
          cc -std=c11 -O2 -static -Werror=implicit-function-declaration -o "$RUNNER_TEMP/native-metadata" tools/native/task245-control-profile/metadata.c
          cc -std=c11 -O2 -static -Werror=implicit-function-declaration -o "$RUNNER_TEMP/metadata-regression" tools/native/task245-control-profile/metadata_test.c
          cc -std=c11 -O2 -static -Werror=implicit-function-declaration -o "$RUNNER_TEMP/native-control-probe" tools/native/task245-control-profile/probe.c
          cc -std=c11 -O2 -static -Werror=implicit-function-declaration -o "$RUNNER_TEMP/native-release-fixture" tools/native/task245-acceptance/release_fixture.c
          cc -std=c11 -O2 -static -Werror=implicit-function-declaration -o "$RUNNER_TEMP/native-gateway" tools/native/task245-acceptance/gateway.c
      - name: Run pure Go source tests
        shell: bash
        working-directory: tools/native
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test -run='Test(EncodeLaunchPacket|ParseKeeperConfig)' ./task245-native-supervisor
          go test ./task245-native-content ./task240-native-policy ./task240-native-provider ./task245-lab-broker
      - name: Build native Go binaries
        shell: bash
        working-directory: tools/native
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/native-supervisor" ./task245-native-supervisor
          go build -o "$RUNNER_TEMP/native-provider" ./task240-native-provider
          go build -o "$RUNNER_TEMP/native-lab-broker" ./task245-lab-broker

  connected-lab:
    name: Disposable lab CLI-to-native mechanism (not OpenClaw adoption)
    needs: source-checks
    if: github.event_name == 'workflow_dispatch' && inputs.connected_lab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lab_case:
          - confinement
          - connected
          - wrong-holder
          - unexpected-exec
          - partial-ack
          - lost-ack
          - cancel
    # This job deliberately runs the root-only driver in its disposable lab.
    # It is manual-only, has no secrets, and reports mechanism acceptance only.
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out pinned public product source (read-only input)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: PHPCraftdream/ssjack
          ref: ca7ce8023f3fb1a3498d801eda29aa3614961a79
          path: .task245-product-source
          persist-credentials: false
          fetch-depth: 1
      - name: Set up existing native toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache: false
      - name: Run disposable lab acceptance
        shell: bash
        env:
          TASK245_LAB_CASE: ${{ matrix.lab_case }}
          TASK245_PRODUCT_CHECKOUT: ${{ github.workspace }}/.task245-product-source
          TASK245_PRODUCT_COMMIT: ca7ce8023f3fb1a3498d801eda29aa3614961a79
          TASK245_PRODUCT_BASE: 2997e692cdc24f5b9a5aa23cadc3b22ab1b32f02
          TASK245_PRODUCT_TAG: ''
          TASK245_IMAGE: python:3.13-slim
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          python3 tools/native/task245-acceptance/run.py
