name: CI

on:
  # Feature and integration revisions use related checks; full verification is explicit.
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full check suite instead of the fast tier"
        type: boolean
        default: false
      base_ref:
        description: "Optional related-check base for a manual feature run"
        type: string
        default: ''

# Full verification is reserved for explicit end-of-sprint dispatches.
env:
  FULL_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
  CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}

concurrency:
  # Event-scoped groups keep feature pushes from cancelling manual sprint verification.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Matrix cell: Linux host, local + ssh target (docs/guide/requirements.md).
    name: "Linux (local + ssh) — Node ${{ matrix.node }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Check out
        # Full depth supports the event base and first-push/manual fallback.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Fail-closed production license audit
        run: npm run license:audit

      - name: Fast tier — typecheck, lint, affected checks
        if: env.FULL_TIER != 'true'
        shell: bash
        # Use the event's exact base; only first-push/manual runs need merge-base fallback.
        run: |
          npm run typecheck
          npm run lint
          base="$CHECK_BASE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="$(git merge-base origin/main HEAD)"; fi
          git rev-parse --verify "$base^{commit}" >/dev/null
          node --experimental-strip-types tools/clawwright.ts check --related --base "$base"

      # ubuntu-latest ships openssh-client but not always a running sshd: install it if
      # missing, start it, and authorize a passphrase-less key for the `ssh-loopback`
      # capability probe (`ssh -o BatchMode=yes ... localhost true`, see CONTRIBUTING.md).
      - name: Provision ssh-loopback capability
        if: env.FULL_TIER == 'true'
        run: |
          set -euo pipefail
          if ! dpkg -s openssh-server >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y openssh-server
          fi
          sudo systemctl enable --now ssh
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=5 localhost true

      - name: Cache the disposable PID namespace fixture
        if: env.FULL_TIER == 'true'
        run: docker pull --quiet alpine:3.20

      - name: Run checks
        if: env.FULL_TIER == 'true'
        # ubuntu-latest ships a working docker daemon, a GNU userland (linux-host, posix-sh,
        # rsync come preinstalled), bash and PowerShell, and now a loopback sshd: a check that
        # requires any of these and still cannot reach it should fail loudly, not skip (see the
        # check runner's capability layer in CONTRIBUTING.md).
        # `ssh-loopback` is provisioned by the step above;
        # it is only a recognized capability name once the check runner's capability list
        # (see CONTRIBUTING.md, "Host capability labels") includes it — this job assumes
        # that has landed (see docs/guide/requirements.md).
        env:
          OC_CHECK_REQUIRE: docker,ssh-loopback,posix-sh,rsync,linux-host,gnu-userland,bash,pwsh
          OC_CHECK_SSH_HOST: localhost
        run: npm test

      # The system-wide install a user runs, then the command from PATH in a fresh app folder:
      # the check suite drives the installer into a scratch prefix, this is the real one.
      - name: Install system-wide and use it in an app folder
        if: env.FULL_TIER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run install:system
          app="$RUNNER_TEMP/cf-system-smoke"
          mkdir -p "$app"
          cd "$app"
          clawwright version
          clawwright init
          help="$(clawwright help 2>&1)"
          grep -q bootstrap <<<"$help"
          ./clawwright version

      - name: Typecheck and lint
        if: env.FULL_TIER == 'true'
        run: npm run format:check

      - name: Build package
        if: env.FULL_TIER == 'true'
        run: npm run build

      - name: Verify package contents
        if: env.FULL_TIER == 'true'
        run: npm run pack:check

      - name: Pack the verified development candidate
        if: env.FULL_TIER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd tools/framework && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/artifacts")
          archive="$(ls artifacts/*.tgz)"
          tar -tzf "$archive" > "$RUNNER_TEMP/packed-files.txt"
          for file in LICENSE LICENSE-MIT LICENSE-APACHE NOTICE THIRD_PARTY_NOTICES.md; do
            grep -qx "package/$file" "$RUNNER_TEMP/packed-files.txt"
            tar -xOf "$archive" "package/$file" | cmp - "tools/framework/$file"
          done
          tar -xOf "$archive" package/package.json | cmp - tools/framework/package.json
          printf '%s\n' "$GITHUB_SHA" > artifacts/BUILD_COMMIT
          (cd artifacts && sha256sum *.tgz > SHA256SUMS)

      - name: Retain the development candidate
        if: env.FULL_TIER == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clawwright-candidate
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Check timing summary
        if: always()
        # The E3 run-timings feature: prints the stored ranking even when a check step failed.
        run: node --experimental-strip-types tools/clawwright.ts check --timings

  macos-checks:
    # Matrix cell: macOS host, ssh target only — no local target on macOS by design
    # (docs/guide/requirements.md: macOS cannot run the GNU/Linux-specific target commands
    # itself). This job is host-side coverage: it proves the framework's own code (transport,
    # CLI, checks) on a real macOS host, reaching a loopback target over ssh.
    name: "macOS (ssh target only) — Node ${{ matrix.node }}"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Check out
        # Full depth supports the event base and first-push/manual fallback.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Fail-closed production license audit
        run: npm run license:audit

      - name: Fast tier — typecheck, lint, affected checks
        if: env.FULL_TIER != 'true'
        shell: bash
        # Use the event's exact base; only first-push/manual runs need merge-base fallback.
        run: |
          npm run typecheck
          npm run lint
          base="$CHECK_BASE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="$(git merge-base origin/main HEAD)"; fi
          git rev-parse --verify "$base^{commit}" >/dev/null
          node --experimental-strip-types tools/clawwright.ts check --related --base "$base"

      # `setremotelogin` is the documented way to turn on sshd on GitHub's hosted macOS
      # runners without a GUI session; ASSUMPTION (unverified here — no Actions run available):
      # it completes synchronously on macos-latest and needs no reboot/wait loop. If that
      # assumption is wrong, `ssh -o BatchMode=yes ... localhost true` below fails loudly and
      # names the real cause instead of the check step failing with an opaque skip/require error.
      - name: Provision ssh-loopback capability
        if: env.FULL_TIER == 'true'
        run: |
          set -euo pipefail
          sudo systemsetup -setremotelogin on
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=5 localhost true

      - name: Run checks
        if: env.FULL_TIER == 'true'
        # ssh-loopback plus the two shells a check executes for real (bash, pwsh) are demanded:
        # macOS ships both, and demanding them is also what proves pwsh is on the runner. This
        # job still claims no docker/wsl/rsync/posix-sh — macOS has no local target, see
        # docs/guide/requirements.md. Same capability-name landing assumption as the Linux job.
        env:
          OC_CHECK_REQUIRE: ssh-loopback,bash,pwsh
          OC_CHECK_SSH_HOST: localhost
        run: npm run check

      # The system-wide install a user runs, then the command from PATH in a fresh app folder:
      # the check suite drives the installer into a scratch prefix, this is the real one.
      - name: Install system-wide and use it in an app folder
        if: env.FULL_TIER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run install:system
          app="$RUNNER_TEMP/cf-system-smoke"
          mkdir -p "$app"
          cd "$app"
          clawwright version
          clawwright init
          help="$(clawwright help 2>&1)"
          grep -q bootstrap <<<"$help"
          ./clawwright version

      - name: Typecheck and lint
        if: env.FULL_TIER == 'true'
        run: npm run format:check

      - name: Check timing summary
        if: always()
        # The E3 run-timings feature: prints the stored ranking even when a check step failed.
        run: node --experimental-strip-types tools/clawwright.ts check --timings

  windows-checks:
    # Matrix cell: Windows host, no WSL — the "no-WSL" cell. The same `npm run check` every
    # job runs, plus typecheck/lint/build. No hand-maintained path list: a check file that
    # cannot run without a host capability (a usable docker daemon, a WSL distro, a real POSIX
    # shell, bash or PowerShell, rsync) names it with a `// check:requires <cap>` header, and the runner skips
    # exactly that file on a host lacking it — reported as `SKIP <label> — needs <cap>` and
    # counted separately in the closing summary, never silently. OC_CHECK_REQUIRE (bash,pwsh
    # here; windows-wsl below and windows-full.yml's self-hosted WSL+Docker job set their own
    # lists) turns a skip into a failure for the named capabilities instead, so a capability that
    # job is supposed to have but cannot reach fails loudly rather than quietly skipping.
    name: "Windows (no WSL) — Node ${{ matrix.node }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - name: Check out
        # Full depth supports the event base and first-push/manual fallback.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Fail-closed production license audit
        run: npm run license:audit

      - name: Fast tier — typecheck, lint, affected checks
        if: env.FULL_TIER != 'true'
        # Windows keeps its default shell: a bash step puts MSYS coreutils first on PATH, and their
        # mkdir cannot apply modes to Windows paths (the instance lock records ownership with it).
        # Use the event's exact base; only first-push/manual runs need merge-base fallback.
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $base = $env:CHECK_BASE
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = git merge-base origin/main HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git rev-parse --verify "$base^{commit}" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types tools/clawwright.ts check --related --base $base
          exit $LASTEXITCODE

      - name: Run checks
        if: env.FULL_TIER == 'true'
        # The two shells a check executes for real are demanded too: bash (Git for Windows) and
        # pwsh (PowerShell 5.1 through the powershell.exe fallback when pwsh is absent) — both
        # ship on the runner image, so a check requiring either fails loudly, never skips.
        env:
          OC_CHECK_REQUIRE: bash,pwsh
        run: npm run check

      # The system-wide install a user runs, then the command from PATH in a fresh app folder:
      # the check suite drives the installer into a scratch prefix, this is the real one.
      - name: Install system-wide and use it in an app folder
        if: env.FULL_TIER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run install:system
          app="$RUNNER_TEMP/cf-system-smoke"
          mkdir -p "$app"
          cd "$app"
          clawwright version
          clawwright init
          help="$(clawwright help 2>&1)"
          grep -q bootstrap <<<"$help"
          ./clawwright version

      - name: The system-wide command from PowerShell
        if: env.FULL_TIER == 'true'
        shell: pwsh
        run: |
          # help is written to stderr; Actions runs pwsh with Stop, which 2>&1 must not trip.
          $ErrorActionPreference = 'Continue'
          Set-Location (Join-Path $env:RUNNER_TEMP 'cf-system-smoke')
          $version = clawwright version
          if ($LASTEXITCODE -ne 0) { throw 'clawwright version failed' }
          $help = clawwright help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not ($help -match 'bootstrap')) { throw 'clawwright help did not list the deployment commands' }
          $version

      - name: Typecheck and lint
        if: env.FULL_TIER == 'true'
        run: npm run format:check

      - name: Build package
        if: env.FULL_TIER == 'true'
        run: npm run build

      - name: Verify package contents
        if: env.FULL_TIER == 'true'
        run: npm run pack:check

      - name: Check timing summary
        if: always()
        # The E3 run-timings feature: prints the stored ranking even when a check step failed.
        run: node --experimental-strip-types tools/clawwright.ts check --timings

  windows-wsl:
    # Matrix cell: Windows host, WSL2 target — the only hosted-runner attempt at exercising a
    # real (not stubbed) WSL2 distro, short of windows-full.yml's self-hosted job. UNVERIFIED
    # ASSUMPTION (no Actions run available here, and this repo adds no network calls to check
    # GitHub's current runner-images docs): hosted windows-latest runners have historically
    # lacked the nested virtualization WSL2's lightweight VM needs, so `wsl --install` /
    # starting a distro may simply fail here — that is why windows-full.yml exists on a
    # self-hosted runner. This job is advisory (continue-on-error) until a hosted run proves
    # it; its provisioning step fails with a named reason, so a failure reads as "no nested
    # virtualization on this runner" rather than a mysterious wsl.exe error.
    name: "Windows (WSL2)"
    runs-on: windows-latest
    # Advisory until a hosted run proves WSL2 starts here (nested virtualization is not
    # guaranteed); then flip to false.
    continue-on-error: true
    steps:
      - name: Check out
        # Full depth supports the event base and first-push/manual fallback.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Fail-closed production license audit
        run: npm run license:audit

      - name: Fast tier — typecheck, lint, affected checks
        if: env.FULL_TIER != 'true'
        # Windows keeps its default shell: a bash step puts MSYS coreutils first on PATH, and their
        # mkdir cannot apply modes to Windows paths (the instance lock records ownership with it).
        # Use the event's exact base; only first-push/manual runs need merge-base fallback.
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $base = $env:CHECK_BASE
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = git merge-base origin/main HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git rev-parse --verify "$base^{commit}" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types tools/clawwright.ts check --related --base $base
          exit $LASTEXITCODE

      - name: Provision a real WSL2 distro (best-effort)
        if: env.FULL_TIER == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wsl.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'wsl.exe is not available on this runner image' }
          wsl.exe --install -d Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'wsl --install could not provision Ubuntu-24.04 (likely missing nested virtualization on this hosted runner; see windows-full.yml for the self-hosted path)' }
          wsl.exe -d Ubuntu-24.04 -- true
          if ($LASTEXITCODE -ne 0) { throw 'Ubuntu-24.04 could not start (WSL2 VM likely unavailable on this hosted runner; see windows-full.yml for the self-hosted path)' }

      - name: Run checks (WSL required)
        if: env.FULL_TIER == 'true'
        # Only wsl is demanded: docker is not required here (no Linux-container docker on
        # hosted Windows runners). This job installs nothing else inside the distro — no check
        # currently declares `// check:requires wsl` that also needs anything beyond a distro
        # that can run `true`; if a future check needs more, add it there, not here.
        shell: pwsh
        env:
          OC_WSL_DISTRO: Ubuntu-24.04
          OC_CHECK_REQUIRE: wsl
        run: npm run check

      - name: Check timing summary
        if: always()
        # The E3 run-timings feature: prints the stored ranking even when a check step failed.
        run: node --experimental-strip-types tools/clawwright.ts check --timings

  windows-controls:
    # Each control breaks guarded code in a copy and requires its check to fail, proving the
    # checks still bite. Several controls guard Windows behaviour (cmd/pwsh quoting, drive
    # changes, tar path normalization), so they run on a Windows host with WSL, split into
    # three disjoint round-robin shards that run in parallel. Full tier only: the job-level
    # condition repeats FULL_TIER because the env context is not available in jobs.<id>.if.
    name: "Negative controls (${{ matrix.shard }})"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "1/3"
          - "2/3"
          - "3/3"
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Provision a real WSL2 distro (best-effort)
        # Controls whose checks need WSL are reported as skipped when this fails.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          wsl.exe --install -d Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'wsl --install could not provision Ubuntu-24.04' }
          wsl.exe -d Ubuntu-24.04 -- true
          if ($LASTEXITCODE -ne 0) { throw 'Ubuntu-24.04 could not start' }

      - name: Negative controls
        shell: pwsh
        env:
          OC_WSL_DISTRO: Ubuntu-24.04
        run: npm run check:controls -- --shard ${{ matrix.shard }}
