name: Tooling policy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache: false
          check-latest: false
      - name: Test and enforce repository tooling policy
        working-directory: tools/tooling-policy
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go run . --root ../..
