name: Publish Clawwright

# The first release is made with the NPM_TOKEN secret. The OIDC path is prepared for a
# later Trusted Publisher and stays unavailable until its repository variable is enabled.
on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "How to authenticate the publish"
        required: true
        type: choice
        options:
          - trusted-publisher
          - token
        default: trusted-publisher

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the selected release ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require a version tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: exit 1

      - name: Require the tag to match the package version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const { version } = JSON.parse(readFileSync("tools/framework/package.json", "utf8"));
          const expectedTag = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            console.error(`release tag ${process.env.GITHUB_REF_NAME} does not match package version ${version}`);
            process.exitCode = 1;
          }
          NODE

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install development dependencies
        run: npm ci --include=dev

      - name: Fail-closed production license audit
        run: npm run license:audit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run pack:check

      # The publish jobs receive this tarball rather than rebuilding from a fresh checkout:
      # prepack needs the repository's dev-installed tsgo, and neither node_modules nor dist
      # travels between runners, so a rebuild there would fail. Packing once also means the
      # published bytes are exactly the ones this job built and checked.
      - name: Pack the release tarball
        working-directory: tools/framework
        run: npm pack

      - name: Inspect packed license evidence
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls tools/framework/*.tgz)"
          tar -tzf "$archive" > "$RUNNER_TEMP/packed-files.txt"
          for file in LICENSE LICENSE-MIT LICENSE-APACHE NOTICE THIRD_PARTY_NOTICES.md; do
            grep -qx "package/$file" "$RUNNER_TEMP/packed-files.txt"
            tar -xOf "$archive" "package/$file" | cmp - "tools/framework/$file"
          done
          tar -xOf "$archive" package/package.json | cmp - tools/framework/package.json

      - name: Upload the release tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: tools/framework/phpcraftdream-clawwright-*.tgz
          if-no-files-found: error

  publish-token:
    needs: verify
    if: ${{ inputs.publish_mode == 'token' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the tarball verify built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: release

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A tarball argument is published as-is: npm runs no prepack, so no build or
      # node_modules is needed on this runner.
      - name: Publish with the NPM_TOKEN secret
        working-directory: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public phpcraftdream-clawwright-*.tgz

  publish-trusted-publisher:
    needs: verify
    if: ${{ inputs.publish_mode == 'trusted-publisher' && vars.CLAWWRIGHT_ENABLE_TRUSTED_PUBLISHER == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the tarball verify built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: release

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish with npm Trusted Publisher
        working-directory: release
        run: npm publish --provenance --access public phpcraftdream-clawwright-*.tgz
